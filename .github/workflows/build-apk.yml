name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generates the android/ folder; existing files such as lib/ are kept.
      - name: Generate Android platform files
        run: flutter create . --platforms=android --org com.ahmed.examprep --project-name exam_prep

      # The generated sample test refers to a counter app we do not have.
      - name: Remove generated sample test
        run: rm -f test/widget_test.dart

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: exam-prep-apk
          path: build/app/outputs/flutter-apk/app-release.apk
